<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsightHub Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.20.15/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.1/js/all.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
      }
      .gradient-bg {
        background: linear-gradient(135deg, #1a1f35 0%, #2a2e45 100%);
      }
      .light-theme {
        background: #f5f7fa;
        color: #1a1f35;
      }
      .card-hover {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card-hover:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      }
      .sidebar {
        transition: width 0.3s ease;
      }
      .chart-container {
        position: relative;
        width: 100%;
        height: 300px;
      }
      .table-container {
        max-height: 400px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const salesData = {
        labels: ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul"],
        datasets: [
          {
            label: "Product A Sales",
            data: [12000, 15000, 17000, 14000, 18000, 20000, 22000],
            borderColor: "#00D4FF",
            backgroundColor: "rgba(0, 212, 255, 0.2)",
            fill: true,
            tension: 0.4,
          },
          {
            label: "Product B Sales",
            data: [8000, 10000, 9000, 11000, 13000, 12000, 14000],
            borderColor: "#FF00A0",
            backgroundColor: "rgba(255, 0, 160, 0.2)",
            fill: true,
            tension: 0.4,
          },
        ],
      };

      const tableData = [
        {
          id: 1,
          product: "Product A",
          sales: 22000,
          date: "2025-07-01",
          region: "North America",
        },
        {
          id: 2,
          product: "Product B",
          sales: 14000,
          date: "2025-07-01",
          region: "Europe",
        },
        {
          id: 3,
          product: "Product A",
          sales: 18000,
          date: "2025-06-01",
          region: "Asia",
        },
        {
          id: 4,
          product: "Product B",
          sales: 12000,
          date: "2025-06-01",
          region: "South America",
        },
      ];

      const activityFeed = [
        { id: 1, action: "New sales data uploaded", time: "2025-07-21 18:30" },
        {
          id: 2,
          action: "User John updated dashboard",
          time: "2025-07-21 17:15",
        },
        {
          id: 3,
          action: "Alert: Sales target reached",
          time: "2025-07-21 16:00",
        },
      ];

      function KPICard({ title, value, change, icon }) {
        return (
          <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg card-hover">
            <div className="flex items-center">
              <i
                className={`${icon} text-3xl text-cyan-500 mr-4`}
                aria-hidden="true"
              ></i>
              <div>
                <h3 className="text-lg font-semibold text-gray-700 dark:text-gray-200">
                  {title}
                </h3>
                <p className="text-2xl font-bold text-gray-900 dark:text-white">
                  {value}
                </p>
                <p
                  className={`text-sm ${
                    change >= 0 ? "text-green-500" : "text-red-500"
                  }`}
                >
                  {change >= 0 ? "+" : ""}
                  {change}% from last month
                </p>
              </div>
            </div>
          </div>
        );
      }

      function SalesChart({ theme }) {
        const chartRef = useRef(null);

        useEffect(() => {
          const ctx = document.getElementById("salesChart").getContext("2d");
          chartRef.current = new Chart(ctx, {
            type: "line",
            data: salesData,
            options: {
              responsive: true,
              plugins: {
                legend: {
                  position: "top",
                  labels: { color: theme === "dark" ? "#FFFFFF" : "#1A1F35" },
                },
                title: {
                  display: true,
                  text: "Sales Performance (2025)",
                  color: theme === "dark" ? "#FFFFFF" : "#1A1F35",
                  font: { size: 18 },
                },
              },
              scales: {
                x: {
                  grid: {
                    color:
                      theme === "dark"
                        ? "rgba(255, 255, 255, 0.1)"
                        : "rgba(0, 0, 0, 0.1)",
                  },
                  ticks: { color: theme === "dark" ? "#FFFFFF" : "#1A1F35" },
                },
                y: {
                  grid: {
                    color:
                      theme === "dark"
                        ? "rgba(255, 255, 255, 0.1)"
                        : "rgba(0, 0, 0, 0.1)",
                  },
                  ticks: {
                    color: theme === "dark" ? "#FFFFFF" : "#1A1F35",
                    beginAtZero: true,
                  },
                },
              },
            },
          });
          return () => {
            if (chartRef.current) {
              chartRef.current.destroy();
              chartRef.current = null;
            }
          };
        }, [theme]);

        return (
          <canvas
            id="salesChart"
            className="chart-container"
            aria-label="Sales Performance Chart"
          ></canvas>
        );
      }

      function DataTable({ data }) {
        const [sortConfig, setSortConfig] = useState({
          key: "sales",
          direction: "desc",
        });
        const [sortedData, setSortedData] = useState(data);

        useEffect(() => {
          const sorted = [...data].sort((a, b) => {
            if (a[sortConfig.key] < b[sortConfig.key])
              return sortConfig.direction === "asc" ? -1 : 1;
            if (a[sortConfig.key] > b[sortConfig.key])
              return sortConfig.direction === "asc" ? 1 : -1;
            return 0;
          });
          setSortedData(sorted);
        }, [sortConfig, data]);

        const requestSort = (key) => {
          setSortConfig((prev) => ({
            key,
            direction:
              prev.key === key && prev.direction === "asc" ? "desc" : "asc",
          }));
        };

        return (
          <div className="table-container bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
            <h2 className="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">
              Sales Data
            </h2>
            <table className="min-w-full">
              <thead>
                <tr className="text-left text-gray-700 dark:text-gray-200">
                  <th
                    className="p-4 cursor-pointer"
                    onClick={() => requestSort("product")}
                    tabIndex="0"
                    aria-label="Sort by Product"
                  >
                    Product{" "}
                    {sortConfig.key === "product" &&
                      (sortConfig.direction === "asc" ? "↑" : "↓")}
                  </th>
                  <th
                    className="p-4 cursor-pointer"
                    onClick={() => requestSort("sales")}
                    tabIndex="0"
                    aria-label="Sort by Sales"
                  >
                    Sales{" "}
                    {sortConfig.key === "sales" &&
                      (sortConfig.direction === "asc" ? "↑" : "↓")}
                  </th>
                  <th className="p-4">Date</th>
                  <th className="p-4">Region</th>
                </tr>
              </thead>
              <tbody>
                {sortedData.map((row) => (
                  <tr
                    key={row.id}
                    className="border-t border-gray-200 dark:border-gray-700"
                  >
                    <td className="p-4 text-gray-900 dark:text-white">
                      {row.product}
                    </td>
                    <td className="p-4 text-gray-900 dark:text-white">
                      ${row.sales.toLocaleString()}
                    </td>
                    <td className="p-4 text-gray-700 dark:text-gray-200">
                      {row.date}
                    </td>
                    <td className="p-4 text-gray-700 dark:text-gray-200">
                      {row.region}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }

      function ActivityFeed() {
        return (
          <div className="bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
            <h2 className="text-lg font-semibold text-gray-700 dark:text-gray-200 mb-4">
              Activity Feed
            </h2>
            <ul className="space-y-4">
              {activityFeed.map((item) => (
                <li key={item.id} className="flex items-start">
                  <i
                    className="fas fa-circle text-xs text-cyan-500 mt-1 mr-3"
                    aria-hidden="true"
                  ></i>
                  <div>
                    <p className="text-gray-900 dark:text-white">
                      {item.action}
                    </p>
                    <p className="text-sm text-gray-500 dark:text-gray-400">
                      {item.time}
                    </p>
                  </div>
                </li>
              ))}
            </ul>
          </div>
        );
      }

      function Dashboard() {
        const [theme, setTheme] = useState("dark");
        const [sidebarOpen, setSidebarOpen] = useState(true);

        const toggleTheme = () => {
          setTheme(theme === "dark" ? "light" : "dark");
        };

        return (
          <div
            className={`min-h-screen ${
              theme === "dark" ? "gradient-bg text-white" : "light-theme"
            }`}
          >
            <header className="bg-gray-900 dark:bg-gray-900/80 p-4 flex items-center justify-between">
              <div className="flex items-center">
                <button
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                  className="mr-4 text-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500"
                  aria-label={sidebarOpen ? "Close sidebar" : "Open sidebar"}
                >
                  <i className="fas fa-bars"></i>
                </button>
                <h1 className="text-xl font-bold">JumaHub</h1>
              </div>
              <div className="flex items-center space-x-4">
                <div className="relative">
                  <input
                    type="text"
                    placeholder="Search..."
                    className="bg-gray-800 dark:bg-gray-700 text-white rounded-full py-2 px-4 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                    aria-label="Search dashboard"
                  />
                  <i
                    className="fas fa-search absolute right-3 top-2.5 text-gray-400"
                    aria-hidden="true"
                  ></i>
                </div>
                <button
                  onClick={toggleTheme}
                  className="text-2xl focus:outline-none focus:ring-2 focus:ring-cyan-500"
                  aria-label={
                    theme === "dark"
                      ? "Switch to light theme"
                      : "Switch to dark theme"
                  }
                >
                  <i
                    className={theme === "dark" ? "fas fa-sun" : "fas fa-moon"}
                  ></i>
                </button>
                <div className="relative">
                  <i
                    className="fas fa-user-circle text-2xl"
                    aria-label="User profile"
                  ></i>
                </div>
              </div>
            </header>
            <div className="flex">
              <aside
                className={`sidebar ${
                  sidebarOpen ? "w-64" : "w-16"
                } bg-gray-800 p-4`}
              >
                <nav className="space-y-4">
                  {[
                    { icon: "fas fa-home", label: "Home" },
                    { icon: "fas fa-chart-bar", label: "Analytics" },
                    { icon: "fas fa-database", label: "Data Sources" },
                    { icon: "fas fa-eye", label: "Visualizations" },
                    { icon: "fas fa-bell", label: "Alerts" },
                  ].map((item, index) => (
                    <a
                      key={index}
                      href="#"
                      className="flex items-center space-x-2 text-gray-200 hover:text-cyan-500 focus:outline-none focus:ring-2 focus:ring-cyan-500"
                      aria-label={item.label}
                    >
                      <i className={item.icon}></i>
                      {sidebarOpen && <span>{item.label}</span>}
                    </a>
                  ))}
                </nav>
              </aside>
              <main className="flex-1 p-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">
                  <KPICard
                    title="Total Sales"
                    value="$87,000"
                    change={12.5}
                    icon="fas fa-dollar-sign"
                  />
                  <KPICard
                    title="Users"
                    value="1,234"
                    change={8.2}
                    icon="fas fa-users"
                  />
                  <KPICard
                    title="Conversion Rate"
                    value="4.5%"
                    change={-1.3}
                    icon="fas fa-chart-line"
                  />
                  <KPICard
                    title="New Customers"
                    value="156"
                    change={15.0}
                    icon="fas fa-user-plus"
                  />
                </div>
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  <div className="lg:col-span-2 bg-white dark:bg-gray-800 p-6 rounded-lg shadow-lg">
                    <SalesChart theme={theme} />
                  </div>
                  <ActivityFeed />
                </div>
                <div className="mt-6">
                  <DataTable data={tableData} />
                </div>
              </main>
            </div>
          </div>
        );
      }

      ReactDOM.render(<Dashboard />, document.getElementById("root"));
    </script>
  </body>
</html>
